<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}User Management{% endblock title %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&family=Mukta:wght@400;500&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #3d6b54;
            --green-dark: #2f5a45;
            --ink: #1b2e25;
            --muted: #6b7280;
            --border: #cfd5d2;
            --bg: #eef3ed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: "Inter", system-ui, sans-serif;
            color: var(--ink);
        }
        body.auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 610px;
            background: #fff;
            border-radius: 24px;
            padding: 54px;
            box-shadow: 0 20px 50px rgba(30, 60, 45, 0.10);
        }
        .eyebrow {
            margin: 0 0 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--green);
        }
        .card h1 {
            margin: 0 0 14px;
            font-size: 40px;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .subtitle {
            margin: 0 0 32px;
            font-size: 16px;
            color: var(--muted);
        }
        .field { margin-bottom: 22px; }
        .field label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            height: 58px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font: inherit;
            font-size: 16px;
            color: var(--ink);
            background: #fff;
        }
        .field input::placeholder { color: #8b949e; }
        .field input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(61, 107, 84, 0.18);
        }
        .field .helptext { margin-top: 6px; font-size: 13px; color: var(--muted); }
        .errorlist, .errors {
            list-style: none;
            margin: 6px 0 0;
            padding: 0;
            font-size: 14px;
            color: #b42318;
        }
        .form-error {
            margin-bottom: 22px;
            padding: 12px 16px;
            border-radius: 12px;
            background: #fef3f2;
        }
        .row-end { text-align: right; margin: -6px 0 28px; }
        a.link {
            font-size: 15px;
            font-weight: 500;
            color: var(--green);
            text-decoration: none;
        }
        a.link:hover { text-decoration: underline; }
        .btn {
            display: block;
            width: 100%;
            height: 60px;
            border: 0;
            border-radius: 12px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--green-dark); }
        .footer-text {
            margin: 28px 0 0;
            font-size: 15px;
            color: var(--muted);
        }
        .footer-text a { margin-left: 4px; font-weight: 600; }
        @media (max-width: 520px) {
            .card { padding: 32px 24px; }
            .card h1 { font-size: 32px; }
        }
        .hint { margin: -10px 0 28px; font-size: 13px; color: var(--muted); }
    </style>
    {% block extra_head %}{% endblock extra_head %}
</head>
<body class="{% block body_class %}auth-page{% endblock body_class %}">
    {% block body %}
    <main class="card">
        {% block eyebrow %}{% endblock eyebrow %}
        <h1>{% block heading %}Welcome!{% endblock heading %}</h1>
        {% block subtitle %}{% endblock subtitle %}
        {% block content %}{% endblock content %}
    </main>
    {% endblock body %}
</body>
</html>
